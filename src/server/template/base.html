{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} | casman</title>
    <meta name="description" content="Universal man pages from BSD, macOS, Linux, and more">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="alternate" type="application/atom+xml" title="casman feed" href="/feed.xml">
    <link rel="alternate" type="application/json" title="casman feed" href="/feed.json">
    <link rel="manifest" href="/manifest.json">
    <script>
      // Inline theme bootstrap so the page never flashes the wrong palette.
      (function(){
        try {
          var t = localStorage.getItem('casman_theme') || 'auto';
          document.documentElement.setAttribute('data-theme-pref', t);
          document.addEventListener('DOMContentLoaded', function(){
            document.body.setAttribute('data-theme', t);
          });
        } catch(_) {}
      })();
    </script>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false" aria-controls="mainNav">☰</button>
            <a href="/" class="logo">casman</a>
            <form action="/search" method="GET" class="search-form">
                <input type="text" name="q" placeholder="Search man pages..." class="search-input">
                <button type="submit" class="search-btn">Search</button>
            </form>
            <nav class="nav" id="mainNav">
                <a href="/browse">Browse</a>
                <a href="/api/v1/healthz">API</a>
                <button type="button" class="header-btn bookmarks-btn" id="bookmarksBtn"
                        aria-label="Show bookmarks" aria-haspopup="true" aria-expanded="false">
                    <span aria-hidden="true">★</span>
                    <span class="bookmarks-count" id="bookmarksCount">0</span>
                </button>
                <button type="button" class="header-btn history-btn" id="historyBtn"
                        aria-label="Show recently viewed" aria-haspopup="true" aria-expanded="false">
                    <span aria-hidden="true">🕐</span>
                </button>
                <button type="button" class="theme-toggle" id="themeToggle" title="Toggle light/dark/auto theme">🌓 Auto</button>
            </nav>
        </div>
    </header>

    <main class="main">
        {{template "content" .}}
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>casman {{.Version}} - Universal Man Pages</p>
            <p><a href="/feed.xml">RSS</a> | <a href="/sitemap.xml">Sitemap</a> | <a href="/openapi">API Docs</a></p>
        </div>
    </footer>

    <script src="/static/script.js"></script>
</body>
</html>
{{end}}
