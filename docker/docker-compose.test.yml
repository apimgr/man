# casman Test Compose
# See AI.md PART 27 for details.
# FOR AI AND AUTOMATED TESTING - This is the ONLY docker-compose file AI may use.
# MUST be copied to temp directory before use - NEVER run from project directory.

name: casman-test

services:
  casman:
    image: ghcr.io/casapps/casman:latest
    container_name: casman-test
    restart: "no"
    environment:
      - MODE=development
      - DEBUG=true
      - TZ=America/New_York
    ports:
      - "64581:80"
    volumes:
      # CRITICAL: ./rootfs/ must resolve to $TEMP_DIR/rootfs/, NOT project directory
      # This file MUST be copied to a temp directory before running
      # AI: NEVER run this from the project directory
      - ./rootfs/config:/config
      - ./rootfs/data:/data
    networks:
      - casman-test

networks:
  casman-test:
    name: casman-test
    external: false
