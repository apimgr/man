# casman Development Compose
# See AI.md PART 27 for details.
# FOR HUMAN USE ONLY - AI assistants must NEVER use this file.

name: casman-dev

services:
  casman:
    image: ghcr.io/casapps/casman:latest
    container_name: casman-dev
    restart: unless-stopped
    environment:
      # Development: relaxed security, verbose logging, no caching
      # Does NOT enable debug endpoints - uncomment DEBUG=true for that
      - MODE=development
      - TZ=America/New_York
      # DEBUG: Uncomment to enable pprof, expvar, detailed request logging
      # - DEBUG=true
    ports:
      # Development: accessible from all interfaces
      - "64580:80"
    volumes:
      # Runtime data is stored under ./volumes/ beside the compose project.
      # NEVER run from project directory - always use temp dir workflow
      - ./volumes/config:/config
      - ./volumes/data:/data
    networks:
      - casman-dev

networks:
  casman-dev:
    name: casman-dev
    external: false
